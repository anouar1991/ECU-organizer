<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256">
  <!-- Dark app background (matches app bg #1a1d23) with rounded corners -->
  <rect x="0" y="0" width="48" height="48" rx="6" ry="6" fill="#1a1d23"/>
  <!-- Chip group: original 32x32 SVG centered with 8px padding on each side -->
  <g transform="translate(8,8)">
    <rect x="3" y="3" width="26" height="26" rx="4" fill="none" stroke="#5fc8e8" stroke-width="2"/>
    <rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="#5fc8e8" stroke-width="1.5"/>
    <line x1="3"  y1="11" x2="0"  y2="11" stroke="#5fc8e8" stroke-width="2"/>
    <line x1="3"  y1="16" x2="0"  y2="16" stroke="#5fc8e8" stroke-width="2"/>
    <line x1="3"  y1="21" x2="0"  y2="21" stroke="#5fc8e8" stroke-width="2"/>
    <line x1="29" y1="11" x2="32" y2="11" stroke="#5fc8e8" stroke-width="2"/>
    <line x1="29" y1="16" x2="32" y2="16" stroke="#5fc8e8" stroke-width="2"/>
    <line x1="29" y1="21" x2="32" y2="21" stroke="#5fc8e8" stroke-width="2"/>
    <line x1="11" y1="3"  x2="11" y2="0"  stroke="#5fc8e8" stroke-width="2"/>
    <line x1="16" y1="3"  x2="16" y2="0"  stroke="#5fc8e8" stroke-width="2"/>
    <line x1="21" y1="3"  x2="21" y2="0"  stroke="#5fc8e8" stroke-width="2"/>
    <line x1="11" y1="29" x2="11" y2="32" stroke="#5fc8e8" stroke-width="2"/>
    <line x1="16" y1="29" x2="16" y2="32" stroke="#5fc8e8" stroke-width="2"/>
    <line x1="21" y1="29" x2="21" y2="32" stroke="#5fc8e8" stroke-width="2"/>
  </g>
